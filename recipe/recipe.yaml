schema_version: 1

context:
  version: "1.85.1"
  bz_version: "8.6.0"
  bz_base_url: https://github.com/bazelbuild/bazel/releases/download
  bz_os: ${{ "linux" if linux else "darwin" }}
  bz_arch: ${{ "x86_64" if x86_64 else "arm64" }}
  bz_hash: ${{ "02c355741012603b703e2a8d07ded1212f92ec6eacdabdd552695f8083e7a594" if build_platform == "linux-64" else
               "19b9c2f6dbb87d9d9c64a951e01b9e62abe8b8ea07550206609c62b7f0f12ae9" if build_platform == "linux-aarch64" else
               "6a6d0a42d62fc3a4a391d0b9976f750191ccb9afa7b084e78d0daa0422b202d0" if build_platform == "osx-64" else
               "61776a387f2ea2a515eb92bc1c520b6af6451148216244058f6ee2b4c012cd89" if build_platform == "osx-arm64" else
               "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" }}

package:
  name: grpc_java_plugin
  version: ${{ version }}

source:
  - url: https://github.com/grpc/grpc-java/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 67436b0b6666cd928dc6b7f32c738fce63c2b1b98984dbf351049af5203a853c
    patches:
      - patches/0001-Build-against-system-libprotobuf.patch

  - url: ${{ bz_base_url }}/${{ bz_version }}/bazel_nojdk-${{ bz_version }}-${{ bz_os }}-${{ bz_arch }}
    sha256: ${{ bz_hash }}
    file_name: bazel

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - openjdk
    - if: linux
      then: openjdk 21.*
    - bazel-toolchain >=0.5.11
    - libprotobuf
    - sed
  host:
    - libabseil
    - libabseil-bazel-systemlib
    - libprotobuf
    - libprotobuf-bazel-systemlib
    - protobuf-bazel-rules

tests:
  - script:
      - test -f $PREFIX/bin/grpc_java_plugin

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: gRPC Java Codegen Plugin for Protobuf Compiler
  homepage: https://github.com/grpc/grpc-java/tree/master/compiler

extra:
  recipe-maintainers:
    - xhochy
    - conda-forge/bazel
    - conda-forge/grpc-cpp
